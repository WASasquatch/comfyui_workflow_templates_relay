name: Sync template catalog

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_catalog.py
      - site/**
      - .github/workflows/sync.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream templates (JSON only, no images)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Comfy-Org/workflow_templates.git upstream
          git -C upstream sparse-checkout set --no-cone '/templates/*.json'

      - name: Build catalog
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          NAME="${GITHUB_REPOSITORY#*/}"
          python3 scripts/build_catalog.py --upstream upstream --out . \
            --site-url "https://${OWNER}.github.io/${NAME}/"

      - name: Commit if changed
        run: |
          git add -A README.md catalog
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
            exit 0
          fi
          SHA=$(git -C upstream rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync catalog with Comfy-Org/workflow_templates@${SHA}"
          git push

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp catalog/templates.json _site/templates.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
